name: Build & Package QuickFolder

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build x64 Release & Run Tests
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Cache LLVM-MinGW
      id: cache-llvm-mingw
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/llvm-mingw
        key: llvm-mingw-20260616-ucrt-x86_64

    - name: Setup LLVM-MinGW
      if: steps.cache-llvm-mingw.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/llvm-mingw-20260616-ucrt-x86_64.zip"
        $dest = "$env:RUNNER_TEMP\llvm-mingw.zip"
        $extractDir = "$env:RUNNER_TEMP\llvm-mingw"
        Write-Host "Downloading LLVM-MinGW from $url..."
        Invoke-WebRequest -Uri $url -OutFile $dest
        Write-Host "Extracting LLVM-MinGW..."
        Expand-Archive -Path $dest -DestinationPath $extractDir -Force
        Remove-Item $dest -Force

    - name: Add LLVM-MinGW to PATH
      shell: pwsh
      run: |
        $binPath = "$env:RUNNER_TEMP\llvm-mingw\llvm-mingw-20260616-ucrt-x86_64\bin"
        echo "$binPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Install Inno Setup
      run: |
        choco install innosetup --no-progress -y

    - name: Execute Build Script
      shell: pwsh
      run: |
        .\scripts\build.ps1

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: QuickFolder-x64-Release
        path: |
          dist/QuickFolder.exe
          dist/QuickFolder-Setup-*.exe

    - name: Create GitHub Release (Tags Only)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/QuickFolder.exe
          dist/QuickFolder-Setup-*.exe
        draft: false
        prerelease: false
        generate_release_notes: true
